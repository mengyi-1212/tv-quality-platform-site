<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人眼舒适亮度模型项目汇报</title>
    <link rel="stylesheet" href="../assets/platform-assistant.css?v=20260618-all-pages-v3" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #07101e;
        color: #edf5ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 12% 0%, rgba(27, 129, 248, 0.2), transparent 32%),
          linear-gradient(145deg, #07101e 0%, #0b1728 55%, #07101e 100%);
      }

      button,
      a {
        font: inherit;
      }

      .page {
        width: min(1480px, calc(100% - 40px));
        margin: 0 auto;
        padding: 24px 0 30px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .title-group {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #62afff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        overflow: hidden;
        margin: 0;
        font-size: clamp(20px, 2vw, 30px);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-actions,
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(148, 183, 221, 0.24);
        border-radius: 10px;
        padding: 0 16px;
        background: rgba(14, 31, 52, 0.85);
        color: #e7f2ff;
        cursor: pointer;
        text-decoration: none;
        transition: 160ms ease;
      }

      .button:hover,
      .button:focus-visible {
        border-color: #4e9ff6;
        background: #173b62;
        outline: none;
        transform: translateY(-1px);
      }

      .button.primary {
        border-color: #278df5;
        background: #1682ed;
        color: #fff;
      }

      .presentation-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 176px;
        gap: 16px;
        min-height: 0;
      }

      .viewer {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(130, 174, 218, 0.2);
        border-radius: 16px;
        background: rgba(4, 9, 17, 0.9);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      }

      .stage {
        display: grid;
        min-height: 0;
        flex: 1;
        place-items: center;
        background: #020408;
        aspect-ratio: 16 / 9;
      }

      .stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .controlbar {
        display: flex;
        min-height: 64px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 14px;
        border-top: 1px solid rgba(130, 174, 218, 0.15);
        background: rgba(8, 19, 33, 0.95);
      }

      .slide-count {
        min-width: 68px;
        color: #a9bfd8;
        text-align: center;
      }

      .hint {
        margin: 0;
        color: #829bb7;
        font-size: 13px;
      }

      .thumbnails {
        overflow: auto;
        max-height: calc(100vh - 150px);
        padding: 4px 6px 4px 2px;
        scrollbar-color: #31577f transparent;
      }

      .thumbnail {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        border: 2px solid transparent;
        border-radius: 9px;
        padding: 0;
        overflow: hidden;
        background: #050a11;
        cursor: pointer;
        opacity: 0.58;
        transition: 160ms ease;
      }

      .thumbnail:hover,
      .thumbnail:focus-visible {
        opacity: 0.88;
        outline: none;
      }

      .thumbnail.active {
        border-color: #2f93fa;
        box-shadow: 0 0 0 3px rgba(47, 147, 250, 0.18);
        opacity: 1;
      }

      .thumbnail img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
      }

      .presentation-shell:fullscreen {
        grid-template-columns: 1fr;
        width: 100vw;
        height: 100vh;
        padding: 0;
        background: #020408;
      }

      .presentation-shell:fullscreen .viewer {
        border: 0;
        border-radius: 0;
      }

      .presentation-shell:fullscreen .stage {
        aspect-ratio: auto;
      }

      .presentation-shell:fullscreen .thumbnails {
        display: none;
      }

      @media (max-width: 900px) {
        .page {
          width: min(100% - 24px, 760px);
          padding-top: 14px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .top-actions {
          width: 100%;
          flex-wrap: wrap;
        }

        .presentation-shell {
          grid-template-columns: 1fr;
        }

        .thumbnails {
          display: flex;
          max-height: none;
          gap: 8px;
          padding: 2px 2px 10px;
        }

        .thumbnail {
          width: 132px;
          min-width: 132px;
          margin: 0;
        }

        .hint {
          display: none;
        }
      }

      @media (max-width: 520px) {
        h1 {
          white-space: normal;
        }

        .button {
          min-height: 38px;
          padding: 0 12px;
          font-size: 14px;
        }

        .controlbar {
          min-height: 58px;
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="title-group">
          <p class="eyebrow">Project Presentation · 6.22</p>
          <h1>人眼舒适亮度模型项目汇报</h1>
        </div>
        <div class="top-actions">
          <a class="button" href="dynamic-comfort-brightness.html">返回模型</a>
          <a class="button" href="../data/presentations/人眼舒适亮度模型项目汇报6.22.pptx" download>下载原始 PPT</a>
          <button class="button primary" id="fullscreenButton" type="button">全屏汇报</button>
        </div>
      </header>

      <section class="presentation-shell" id="presentationShell" aria-label="人眼舒适亮度模型项目汇报">
        <div class="viewer">
          <div class="stage">
            <img id="slideImage" src="../data/presentations/人眼舒适亮度模型项目汇报6.22/slide-01.png" alt="汇报第 1 页" />
          </div>
          <footer class="controlbar">
            <div class="controls">
              <button class="button" id="previousButton" type="button" aria-label="上一页">上一页</button>
              <span class="slide-count" id="slideCount">1 / 10</span>
              <button class="button" id="nextButton" type="button" aria-label="下一页">下一页</button>
            </div>
            <p class="hint">方向键或空格键翻页，Esc 退出全屏</p>
          </footer>
        </div>
        <aside class="thumbnails" id="thumbnails" aria-label="幻灯片缩略图"></aside>
      </section>
    </main>

    <script>
      (() => {
        const totalSlides = 10;
        const slideImage = document.getElementById("slideImage");
        const slideCount = document.getElementById("slideCount");
        const thumbnails = document.getElementById("thumbnails");
        const presentationShell = document.getElementById("presentationShell");
        const fullscreenButton = document.getElementById("fullscreenButton");
        let currentSlide = Math.min(totalSlides, Math.max(1, Number(location.hash.slice(1)) || 1));

        function slidePath(number) {
          return `../data/presentations/人眼舒适亮度模型项目汇报6.22/slide-${String(number).padStart(2, "0")}.png`;
        }

        function showSlide(number) {
          currentSlide = Math.min(totalSlides, Math.max(1, number));
          slideImage.src = slidePath(currentSlide);
          slideImage.alt = `汇报第 ${currentSlide} 页`;
          slideCount.textContent = `${currentSlide} / ${totalSlides}`;
          document.querySelectorAll(".thumbnail").forEach((button, index) => {
            const active = index + 1 === currentSlide;
            button.classList.toggle("active", active);
            button.setAttribute("aria-current", active ? "page" : "false");
            if (active) {
              button.scrollIntoView({ block: "nearest", inline: "nearest" });
            }
          });
          history.replaceState(null, "", `#${currentSlide}`);
        }

        for (let number = 1; number <= totalSlides; number += 1) {
          const button = document.createElement("button");
          button.className = "thumbnail";
          button.type = "button";
          button.setAttribute("aria-label", `打开第 ${number} 页`);
          button.innerHTML = `<img src="${slidePath(number)}" alt="" loading="lazy" />`;
          button.addEventListener("click", () => showSlide(number));
          thumbnails.appendChild(button);
        }

        document.getElementById("previousButton").addEventListener("click", () => showSlide(currentSlide - 1));
        document.getElementById("nextButton").addEventListener("click", () => showSlide(currentSlide + 1));
        fullscreenButton.addEventListener("click", async () => {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await presentationShell.requestFullscreen();
          }
        });
        document.addEventListener("fullscreenchange", () => {
          fullscreenButton.textContent = document.fullscreenElement ? "退出全屏" : "全屏汇报";
        });
        document.addEventListener("keydown", (event) => {
          const nextKeys = ["ArrowRight", "ArrowDown", "PageDown", " "];
          const previousKeys = ["ArrowLeft", "ArrowUp", "PageUp"];
          if (nextKeys.includes(event.key)) {
            event.preventDefault();
            showSlide(currentSlide + 1);
          } else if (previousKeys.includes(event.key)) {
            event.preventDefault();
            showSlide(currentSlide - 1);
          } else if (event.key === "Home") {
            showSlide(1);
          } else if (event.key === "End") {
            showSlide(totalSlides);
          }
        });

        showSlide(currentSlide);
      })();
    </script>
    <script src="../assets/platform-assistant.js?v=20260622-comfort-ppt-v2"></script>
  </body>
</html>
